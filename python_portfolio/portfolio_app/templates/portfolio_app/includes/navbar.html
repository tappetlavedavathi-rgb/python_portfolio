{% load static portfolio_extras %}
<header class="site-header" data-header>
    <div class="nav-shell">
        <a class="brand" href="#home" aria-label="{{ profile.name }} home">
            <span class="brand-mark" aria-hidden="true">PD</span>
            <span class="brand-name">{{ profile.name }}</span>
        </a>
        <nav class="nav-links" id="site-nav" aria-label="Primary">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#experience">Experience</a>
            <a href="#projects">Projects</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
        <div class="nav-actions">
            <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
                <span class="theme-icon theme-icon-dark" aria-hidden="true">☾</span>
                <span class="theme-icon theme-icon-light" aria-hidden="true">☀</span>
            </button>
            <a class="btn btn-resume" href="{% resume_url profile %}" download>Resume</a>
            <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>
</header>
